server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    location /jobs {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}
