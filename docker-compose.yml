services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vid2notes
      POSTGRES_USER: vid2notes
      POSTGRES_PASSWORD: vid2notes
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vid2notes -d vid2notes"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/Vid2Notes.Api/Dockerfile
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=vid2notes;Username=vid2notes;Password=vid2notes
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Storage__Endpoint: http://s3:8333
      Storage__AccessKey: vid2notes
      Storage__SecretKey: vid2notes
      Storage__Bucket: vid2notes
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      s3:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: worker
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      S3_ENDPOINT: http://s3:8333
      S3_ACCESS_KEY: vid2notes
      S3_SECRET_KEY: vid2notes
      S3_BUCKET: vid2notes
      MAX_DURATION_SECONDS: "1800"
    depends_on:
      rabbitmq:
        condition: service_healthy
      s3:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

  web:
    build:
      context: web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  s3-data:
